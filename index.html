  </div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="brand-name">Arena</p>
        <p class="brand-sub">Papan skor</p>
      </div>
      <div class="sports" role="tablist" aria-label="Jenis olahraga">
        <button type="button" class="sport" data-sport="futsal" role="tab" aria-selected="true">Futsal</button>
        <button type="button" class="sport" data-sport="soccer" role="tab" aria-selected="false">Sepak bola</button>
        <button type="button" class="sport" data-sport="basket" role="tab" aria-selected="false">Basket</button>
        <button type="button" class="sport" data-sport="badminton" role="tab" aria-selected="false">Bulu tangkis</button>
      </div>
    </header>

    <p id="banner" class="banner" role="status" hidden></p>

    <section class="board" aria-label="Skor pertandingan">
      <div id="teams" class="teams"></div>
    </section>

    <section class="dock" aria-label="Kendali pertandingan">
      <ol id="log" class="log"></ol>
      <div class="dock-actions">
        <button type="button" id="undo">Urungkan</button>
        <button type="button" id="swap">Tukar sisi</button>
        <button type="button" id="reset" class="danger">Reset</button>
      </div>
    </section>
  </div>

  <dialog id="confirm">
    <form method="dialog">
      <p>Hapus skor pertandingan ini dan mulai dari nol?</p>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Batal</button>
        <button value="ok" class="danger">Ya, reset</button>
      </div>
    </form>
  </dialog>
</body>
</html>
